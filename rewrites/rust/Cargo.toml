[package]
name = "shopping-sessions-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8"
arrow-array = "56.2"
arrow-schema = "56.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
memchr = "2"
memmap2 = "0.9"
parquet = { version = "56.2", default-features = false, features = ["arrow", "snap"] }
rayon = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
